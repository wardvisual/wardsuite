name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH deploy → suite.wardvisual.com
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR=/opt/wardsuite

            echo "── Ensure deploy directory exists ───────────"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy — cloning repo..."
              git clone https://github.com/wardvisual/wardsuite.git "$DEPLOY_DIR"
            fi

            echo "── Pulling latest code ──────────────────────"
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "── Writing .env ─────────────────────────────"
            cat > .env << 'DOTENV'
            PORT=3000
            NODE_ENV=production
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_DATABASE_ID=${{ secrets.FIREBASE_DATABASE_ID }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_DATABASE_ID=${{ secrets.VITE_FIREBASE_DATABASE_ID }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DOTENV
            # Private key appended separately — printf keeps literal \n intact
            printf 'FIREBASE_PRIVATE_KEY="%s"\n' '${{ secrets.FIREBASE_PRIVATE_KEY }}' >> .env

            echo "── Rebuilding and restarting containers ─────"
            docker compose up -d --build --force-recreate --remove-orphans

            echo "── Pruning old images ───────────────────────"
            docker image prune -f

            echo "── Health check ─────────────────────────────"
            sleep 15
            curl -sf http://localhost:3000/api/health || (echo "Health check failed" && exit 1)

            echo "── Done ─────────────────────────────────────"
